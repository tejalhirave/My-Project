<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Dashboard - Hostel Management</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;500;600&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
body { background: #f4f6f9; color: #333; }
.dashboard-container { max-width: 1100px; margin: auto; padding: 20px; }
header { display: flex; justify-content: space-between; align-items: center; padding: 20px; background: #2c3e50; color: #fff; border-radius: 10px; }
header h1 { font-size: 22px; }
header select { margin-right: 10px; padding: 5px 8px; border-radius: 5px; border: none; }
header button { background: #e74c3c; border: none; color: #fff; padding: 8px 15px; border-radius: 6px; cursor: pointer; }
header button:hover { background: #c0392b; }
.cards-container { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 20px; margin-top: 25px; }
.card { background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); cursor: pointer; transition: 0.3s; }
.card:hover { transform: translateY(-5px); box-shadow: 0 5px 15px rgba(0,0,0,0.15); }
.card h2 { font-size: 20px; margin-bottom: 8px; color: #2c3e50; }
.card p { font-size: 14px; color: #666; }
#sectionContainer { margin-top: 30px; padding: 25px; background: #fff; border-radius: 12px; box-shadow: 0 3px 8px rgba(0,0,0,0.1); }
#sectionContainer h2, #sectionContainer h3 { margin-bottom: 15px; color: #2c3e50; }
textarea, input, select { width: 100%; padding: 10px; margin: 8px 0; border-radius: 8px; border: 1px solid #ccc; font-size: 14px; }
button { background: #3498db; color: #fff; border: none; padding: 10px 16px; border-radius: 8px; cursor: pointer; margin-top: 10px; }
button:hover { background: #2980b9; }
ul { margin: 10px 0 0 15px; }
li { margin: 5px 0; }
</style>
</head>
<body>
<div class="dashboard-container">
<header>
    <h1 id="welcomeText">Welcome, Student</h1>
    <div>
        <select id="languageSelector">
            <option value="en">English</option>
            <option value="mr">Marathi</option>
            <option value="hi">Hindi</option>
        </select>
        <button id="logoutBtn">Logout</button>
    </div>
</header>

<div class="cards-container">
<div class="card" onclick="openSection('admission')">
<h2>Admission</h2>
<p>Apply for hostel admission.</p>
</div>
<div class="card" onclick="openSection('complaint')">
<h2>Complaint Box</h2>
<p>Submit your complaints.</p>
</div>
<div class="card" onclick="openSection('leave')">
<h2>Leave Application</h2>
<p>Apply for leave.</p>
</div>
<div class="card" onclick="openSection('announcement')">
<h2>Announcements</h2>
<p>View messages from the Warden.</p>
</div>
</div>

<div id="sectionContainer"></div>
</div>

<script>
// Dummy Room Data
if (!localStorage.getItem("rooms")) {
    const roomData = [
        { floor: 1, number: 101, capacity: 3, vacancy: 2 },
        { floor: 1, number: 102, capacity: 2, vacancy: 0 },
        { floor: 2, number: 201, capacity: 3, vacancy: 1 },
        { floor: 2, number: 202, capacity: 2, vacancy: 2 }
    ];
    localStorage.setItem("rooms", JSON.stringify(roomData));
}

// Logout
document.getElementById("logoutBtn").addEventListener("click", () => {
    window.location.href = "login.html";
});

// Language translations
const translations = {
    en: { welcome:"Welcome, Student", logout:"Logout",
          admission:"Admission", admissionDesc:"Apply for hostel admission.",
          complaint:"Complaint Box", complaintDesc:"Submit your complaints.",
          leave:"Leave Application", leaveDesc:"Apply for leave.",
          announcement:"Announcements", announcementDesc:"View messages from the Warden.",
          leaveReason:"Reason for Leave", leaveParentPhone:"Parents' Phone Number", submit:"Submit",
          profileDetails:"Profile Details", fullName:"Full Name", fatherName:"Father's Name",
          motherName:"Mother's Name", birthdate:"Date of Birth", className:"Class / Course", year:"Year",
          clgName:"College Name", address:"Address", caste:"Caste", fatherPhone:"Father's Phone Number",
          motherPhone:"Mother's Phone Number", personalPhone:"Personal Phone Number", aadhar:"Aadhar Card Number",
          uploadPhoto:"Upload Photo", uploadSignature:"Upload Signature", selectRoom:"Select & Request Admission", full:"❌ Full"
    },
    mr: { welcome:"स्वागत आहे, विद्यार्थी", logout:"बाहेर पडा",
          admission:"अॅडमिशन", admissionDesc:"हॉस्टेलसाठी अर्ज करा.",
          complaint:"तक्रार पाटी", complaintDesc:"आपल्या तक्रारी सादर करा.",
          leave:"रजा अर्ज", leaveDesc:"रजेसाठी अर्ज करा.",
          announcement:"जाहिराती", announcementDesc:"वॉर्डनकडून संदेश पहा.",
          leaveReason:"रजेचे कारण", leaveParentPhone:"पालकांचे फोन नंबर", submit:"सादर करा",
          profileDetails:"प्रोफाइल तपशील", fullName:"पूर्ण नाव", fatherName:"वडिलांचे नाव",
          motherName:"आईचे नाव", birthdate:"जन्म तारीख", className:"इयत्ता / कोर्स", year:"वर्ष",
          clgName:"कॉलेज नाव", address:"पत्ता", caste:"जात", fatherPhone:"वडिलांचा फोन नंबर",
          motherPhone:"आईचा फोन नंबर", personalPhone:"वैयक्तिक फोन नंबर", aadhar:"आधार कार्ड नंबर",
          uploadPhoto:"फोटो अपलोड करा", uploadSignature:"स्वाक्षरी अपलोड करा", selectRoom:"निवडा & प्रवेश अर्ज करा", full:"❌ पूर्ण"
    },
    hi: { welcome:"स्वागत है, छात्र", logout:"लॉगआउट",
          admission:"प्रवेश", admissionDesc:"छात्रावास के लिए आवेदन करें।",
          complaint:"शिकायत बॉक्स", complaintDesc:"अपनी शिकायतें दर्ज करें।",
          leave:"अवकाश आवेदन", leaveDesc:"अवकाश के लिए आवेदन करें।",
          announcement:"घोषणाएँ", announcementDesc:"वार्डन से संदेश देखें।",
          leaveReason:"अवकाश का कारण", leaveParentPhone:"अभिभावकों का फोन नंबर", submit:"सबमिट करें",
          profileDetails:"प्रोफ़ाइल विवरण", fullName:"पूरा नाम", fatherName:"पिता का नाम",
          motherName:"माता का नाम", birthdate:"जन्म तिथि", className:"कक्षा / पाठ्यक्रम", year:"वर्ष",
          clgName:"कॉलेज का नाम", address:"पता", caste:"जाति", fatherPhone:"पिता का फोन नंबर",
          motherPhone:"माता का फोन नंबर", personalPhone:"व्यक्तिगत फोन नंबर", aadhar:"आधार कार्ड नंबर",
          uploadPhoto:"फ़ोटो अपलोड करें", uploadSignature:"हस्ताक्षर अपलोड करें", selectRoom:"चुनें & प्रवेश आवेदन करें", full:"❌ पूरा"
    }
};

// Initialize language
const languageSelector = document.getElementById("languageSelector");
function updateLanguage(lang) {
    const t = translations[lang];
    document.getElementById("welcomeText").innerText = t.welcome;
    document.getElementById("logoutBtn").innerText = t.logout;
    const cards = document.querySelectorAll(".card");
    cards[0].querySelector("h2").innerText = t.admission;
    cards[0].querySelector("p").innerText = t.admissionDesc;
    cards[1].querySelector("h2").innerText = t.complaint;
    cards[1].querySelector("p").innerText = t.complaintDesc;
    cards[2].querySelector("h2").innerText = t.leave;
    cards[2].querySelector("p").innerText = t.leaveDesc;
    cards[3].querySelector("h2").innerText = t.announcement;
    cards[3].querySelector("p").innerText = t.announcementDesc;
}
window.onload = () => {
    const lang = localStorage.getItem('selectedLanguage') || 'en';
    languageSelector.value = lang;
    updateLanguage(lang);
};
languageSelector.addEventListener("change", () => {
    const lang = languageSelector.value;
    localStorage.setItem('selectedLanguage', lang);
    updateLanguage(lang);
});

// Sections and tabs
function openSection(section) {
    const t = translations[languageSelector.value];
    const container = document.getElementById("sectionContainer");
    if(section === "admission"){
        container.innerHTML = `
            <h2>${t.admission}</h2>
            <button onclick="openAdmissionTab('profile')">Profile Details</button>
            <button onclick="openAdmissionTab('room')">Select Room</button>
            <div id="admissionTabs"></div>
        `;
    } else if(section === "complaint"){
        container.innerHTML = `
            <h2>${t.complaint}</h2>
            <textarea placeholder="Type your complaint"></textarea>
            <button>${t.submit}</button>
        `;
    } else if(section === "leave"){
        container.innerHTML = `
            <h2>${t.leave}</h2>
            <input type="text" placeholder="${t.leaveReason}">
            <input type="text" placeholder="${t.leaveParentPhone}">
            <button>${t.submit}</button>
        `;
    } else if(section === "announcement"){
        container.innerHTML = `
            <h2>${t.announcement}</h2>
            <ul>
                <li>Message 1 from Warden</li>
                <li>Message 2 from Warden</li>
            </ul>
        `;
    }
}

function openAdmissionTab(tab){
    const t = translations[languageSelector.value];
    const container = document.getElementById("admissionTabs");

    if(tab === "profile"){
        // Load existing profile data if any
        const profile = JSON.parse(localStorage.getItem("studentProfile")) || {};
        container.innerHTML = `
            <h3>${t.profileDetails}</h3>
            <input type="text" id="fullName" placeholder="${t.fullName}" value="${profile.fullName||''}">
            <input type="text" id="fatherName" placeholder="${t.fatherName}" value="${profile.fatherName||''}">
            <input type="text" id="motherName" placeholder="${t.motherName}" value="${profile.motherName||''}">
            <input type="date" id="birthdate" value="${profile.birthdate||''}">
            <input type="text" id="className" placeholder="${t.className}" value="${profile.className||''}">
            <input type="text" id="year" placeholder="${t.year}" value="${profile.year||''}">
            <input type="text" id="clgName" placeholder="${t.clgName}" value="${profile.clgName||''}">
            <input type="text" id="address" placeholder="${t.address}" value="${profile.address||''}">
            <input type="text" id="caste" placeholder="${t.caste}" value="${profile.caste||''}">
            <input type="text" id="fatherPhone" placeholder="${t.fatherPhone}" value="${profile.fatherPhone||''}">
            <input type="text" id="motherPhone" placeholder="${t.motherPhone}" value="${profile.motherPhone||''}">
            <input type="text" id="personalPhone" placeholder="${t.personalPhone}" value="${profile.personalPhone||''}">
            <input type="text" id="aadhar" placeholder="${t.aadhar}" value="${profile.aadhar||''}">
            <label>${t.uploadPhoto}</label>
            <input type="file" id="photo">
            <label>${t.uploadSignature}</label>
            <input type="file" id="signature">
            <button onclick="submitProfile()">${t.submit}</button>
        `;
    } else if(tab === "room"){
        const rooms = JSON.parse(localStorage.getItem("rooms"));
        let roomList = rooms.map(r => 
            `<li>Floor ${r.floor} - Room ${r.number} ${r.vacancy>0? '- Vacant' : t.full}</li>`
        ).join('');
        container.innerHTML = `<h3>${t.selectRoom}</h3><ul>${roomList}</ul>`;
    }
}

function submitProfile(){
    const profile = {
        fullName: document.getElementById("fullName").value,
        fatherName: document.getElementById("fatherName").value,
        motherName: document.getElementById("motherName").value,
        birthdate: document.getElementById("birthdate").value,
        className: document.getElementById("className").value,
        year: document.getElementById("year").value,
        clgName: document.getElementById("clgName").value,
        address: document.getElementById("address").value,
        caste: document.getElementById("caste").value,
        fatherPhone: document.getElementById("fatherPhone").value,
        motherPhone: document.getElementById("motherPhone").value,
        personalPhone: document.getElementById("personalPhone").value,
        aadhar: document.getElementById("aadhar").value
    };
    localStorage.setItem("studentProfile", JSON.stringify(profile));
    alert("Profile saved successfully!");
}
</script>
</body>
</html>
